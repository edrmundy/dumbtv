id: fire-os-8-aftma08c15
title: "Amazon AFTMA08C15"
platform: fireos
status: tested
tested_on: "RS8185.3891N"
models:
  - "AFTMA08C15 (codename karat)"
  - "Fire TV Stick 4K Plus (2025)"
adb:
  port: 5555
  transport: wifi
developer_mode: >-
  Settings > My Fire TV > About > click the device name 7 times, then My Fire TV > Developer Options > ADB debugging: ON
ip_location: "Settings > About > Network"
prompts:
  - name: "USB debugging authorization"
    blocks_automation: true
    fix: "human presses Allow on the TV; tick Always allow"
data:
  packages: data/fireos/packages.txt
  protected: data/fireos/protected.txt
  never_disable: data/fireos/never-disable.txt
  user_apps: data/fireos/user-apps.txt
launcher:
  mechanism: accessibility_service
  package: tv.dumbtv.home
  reason: "Android 11 caps the intent-filter priority of every non-privileged app to 0, so a third-party launcher can never out-rank Amazon's launcher (priority 950, privileged) and cmd package set-home-activity is ignored. The Guard accessibility service watches for Amazon's home window and swaps to dumbtv home"
  fallback: "none: on Fire OS 8 the swap is the only way to take the HOME button"
  quirk: "The swap is a background activity start and Android 11 refuses those unless the DeviceConfig flag activity_manager/default_background_activity_starts_enabled is true; install.sh writes it as a device default"
quirks:
  - "DNS filter on Fire OS 8 (Android 11): the app folder is not writable over adb, so dnsfilter.sh pushes the blocklist to /sdcard/Android/media/dnsfilter.android/ and the app has to be pointed at it by hand. Advanced settings > Configure filter update > the row labelled <new> > edit it: category custom, name dumbtv, URL file:///storage/emulated/0/Android/media/dnsfilter.android/dumbtv-blocklist.txt (three slashes - the app strips file:// and needs the leading slash), untick every built-in entry, set the update interval to 3650 days, then RELOAD FILTER. The log then reads Building index for 415 entries"
  - "Launcher settings and wallpapers on Fire OS 8: /sdcard/Android/data/tv.dumbtv.home/files/ is closed to adb (Permission denied on ls, pull and push), so home.conf and the wallpapers cannot be pushed there. The launcher also reads them from /sdcard/Android/media/tv.dumbtv.home/, which adb can write: home.conf there is applied once and remembered in home.conf.applied, so the same push is not applied twice and a later change in Options is not overwritten. Wallpapers go in wallpapers/ under that folder and are read in name order from both folders"
  - "personalDNSfilter writes a default config on first start with 1Hosts-light, StevenBlack and HageziPro active (381269 entries) and refreshes on its own, so the built-in entries must be unticked by hand and the update interval raised to 3650 days, otherwise the pushed list is overwritten"
  - "The Fire TV on-screen keyboard (com.amazon.tv.ime) swallows key events while a text field is focused: KEYCODE_DEL lands only every few tries unless the deletes are batched into one adb shell input keyevent 67 67 67 call, KEYCODE_MOVE_HOME and the D-pad never arrive, and taps on other fields land one field behind. To clear a field: tap its left edge so the cursor sits at position 0, then a batched KEYCODE_DEL, then adb shell input text"
  - "Launcher on Fire OS 8: HOME cannot be won by resolution. Android 11 caps the intent-filter priority of every non-privileged app to 0 (PackageManagerService/ComponentResolver.adjustPriority) while Amazon's launcher declares HOME with priority 950 and is privileged, so cmd package set-home-activity prints Success and is ignored and HOME always resolves to com.amazon.tv.launcher/.ui.HomeActivity_vNext. The takeover is the accessibility Guard, which swaps to dumbtv home once Amazon's home is on screen"
  - "The Guard's swap is a background activity start and Android 11 refuses those (ActivityStarter.shouldAbortBackgroundActivityStart): the service is bound and the alarm fires, but no activity start is logged and HOME stays on Amazon's home. The switch is Android's own DeviceConfig flag: adb shell cmd device_config put activity_manager default_background_activity_starts_enabled true default - written as a device default, so it survives reboots. With it on, HOME lands on tv.dumbtv.home/.Home, also after a cold reboot. install.sh sets it and --undo deletes it"
  - "ActivityOptions.setPendingIntentBackgroundActivityLaunchAllowed(true) does not help: it is a hidden API, and it only gates isPendingIntentBalAllowedByCaller(), which is already true by default. The flag that decides, allowBackgroundActivityStart, is set by whoever sends the PendingIntent, not by the app that owns it"
  - "The custom-home route is closed: /system/framework/fosservices.jar holds com.amazon.policy.keypolicymanager.CustomHomeButtonHandler, which would send ACTION_CUSTOM_HOME when the manifest metadata com.amazon.metadata.CUSTOM_HOME is set, but the receiver wants the signature|amazon permission, so a third-party app cannot use it"
  - "Every HOME press logs E SELinux: avc: denied { see_home_task } for scontext=u:r:platform_app tclass=amazon_policies; the denial comes from com.amazon.tv.devicecontrol (platform-signed), not from the launcher app, and it does not stop the swap"
  - "com.amazon.firebat is Prime Video on this model as well (versionName PVFTV-324.0104-L, real app in /data with a stub in /system/system_ext/priv-app/com.amazon.firebat-stub), although data/fireos/packages.txt lists it under OTA helpers, so the stock pass disables Prime Video. Prime Video is com.amazon.avod on older builds"
  - "The filter VPN is revoked when personalDNSfilter is killed. The RESTART button in the app brings it back; always_on_vpn_app plus the Autostart checkbox bring it back after a reboot. Do not am force-stop the filter app"
  - "No package in packages.txt was refused (protected 0). Absent on this model: tv.fw.metrics, katoch, vizzini.ftvcds, tv.democontent.provider, tv.localgallery, wha.mediabrowserservice, printspooler, bips, nfc; device.rdmapplication from protected.txt; whisperjoin.middleware.np from never-disable.txt"
  - "com.amazon.device.software.ota and .ota.override share one UID (10087)"
  - "cmd package help exits 255 on this build and lib.sh runs it in a pipeline under set -o pipefail, so REINSTALL is detected as 0 and the debloat only disables the Amazon apps instead of uninstalling them for user 0. Nothing is lost here (restore.sh only has to re-enable them), but the message about a missing install-existing is wrong"
  - "A VPN client (surfshark) is installed on this TV and competes for the single VPN slot with the DNS filter: connecting it takes the filter offline"
notes: "Fire OS 8 (Android 11), build RS8185.3891N: debloat (58 disabled, 0 protected, 0 suspect), lockdown and the DNS filter (415 entries) all work and verify.sh exits 0. The HOME takeover works through the accessibility Guard once Android's background-activity-start switch is on - see the launcher quirks. The home screen shows a wallpaper: eight public domain or CC0 forest photos (Wikimedia Commons), cropped to 1920x1080, pushed to /sdcard/Android/media/tv.dumbtv.home/wallpapers/ and picked by rotate=daytime"
verify:
  blocked: data/blocklists/verify-blocked.txt
  allowed: data/blocklists/verify-allowed.txt
